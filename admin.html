<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#D9C8F5">
  <title>Admin Pesanan | MaduraNyam</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍢</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="css/halaman.css?v=2">
  <link rel="stylesheet" href="css/dashboard.css?v=3">
  <link rel="stylesheet" href="css/pesanan.css?v=2">
</head>
<body class="menunggu">
  <div class="awal" id="awal" role="status" aria-label="Memuat"><span></span></div>

  <div class="app-shell">
    <header class="bar bar-menu">
      <button id="kembali" class="kembali" type="button" aria-label="Kembali ke halaman sebelumnya"><i class="ik ik-kembali" aria-hidden="true"></i>Kembali</button>
      <h1 class="judul-bar">Admin pesanan</h1>
    </header>

    <main class="app">
      <div class="kategori" id="kategori" role="group" aria-label="Saring berdasarkan status"></div>
      <p class="hasil" id="hasil" aria-live="polite"></p>
      <div class="daftar-pesanan" id="daftar"></div>
      <p class="kosong-menu" id="kosong" hidden>Belum ada pesanan.</p>
    </main>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/umum.js?v=4"></script>
  <script src="js/admin.js"></script>
</body>
</html>
