<!DOCTYPE html>
<html lang="id">
<head>

<body class="menunggu">
  <div class="awal" id="awal" role="status" aria-label="Memuat"><span></span></div>

  <div class="app-shell">
    <header class="atas">
      <div class="profil-wrap">
        <button id="profil" class="profil" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="menu-profil">
          <span class="avatar" id="avatar" aria-hidden="true"></span>
          <span class="nama-profil" id="nama-profil"></span>
          <i class="ik ik-turun" aria-hidden="true"></i>
        </button>
        <div id="menu-profil" class="menu-profil" hidden>
          <p class="label">Masuk sebagai</p>
          <p class="nama-penuh" id="nama-penuh"></p>
          <button id="keluar" class="keluar" type="button"><i class="ik ik-keluar" aria-hidden="true"></i>Keluar</button>
        </div>
      </div>
      <span class="logo" aria-hidden="true"></span>
    </header>

    <main class="app">
      <section class="salam">
        <h1 id="salam">Selamat datang</h1>
        <p>Mau makan apa hari ini?</p>
      </section>
      <div class="kategori" id="kategori" role="group" aria-label="Kategori menu"></div>
      <div class="judul-baris"><h2 class="judul-bagian">Menu populer</h2><a href="menu.html">Lihat semua</a></div>
      <div class="menu-grid" id="menu"></div>
    </main>

    <nav class="nav-bawah" aria-label="Navigasi utama">
      <button type="button" aria-current="page"><i class="ik ik-beranda" aria-hidden="true"></i>Beranda</button>
      <button type="button" data-ke="menu.html"><i class="ik ik-menu" aria-hidden="true"></i>Menu</button>
      <button type="button" id="nav-keranjang" data-ke="keranjang.html"><i class="ik ik-keranjang" aria-hidden="true"></i>Keranjang</button>
      <button type="button" data-ke="pesanan.html"><i class="ik ik-pesanan" aria-hidden="true"></i>Pesanan</button>
    </nav>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
