<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#D9C8F5">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="MaduraNyam">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>MaduraNyam</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍢</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&display=swap">
  <link rel="stylesheet" href="css/style.css?v=3">
</head>
<body>

  <!-- Layar loading: ikon aplikasi, nama, dan bar progres -->
  <main class="loading" role="status" aria-label="MaduraNyam">
    <div class="pusat">
      <div class="ikon">
        <svg viewBox="0 0 64 64" aria-hidden="true">
          <defs>
            <radialGradient id="daging" cx="35%" cy="30%" r="75%">
              <stop offset="0" stop-color="#C77A3A"/>
              <stop offset="0.6" stop-color="#8A4519"/>
              <stop offset="1" stop-color="#4A2410"/>
            </radialGradient>
          </defs>
          <line x1="8" y1="56" x2="56" y2="8" stroke="#E5B85C" stroke-width="3.2" stroke-linecap="round"/>
          <ellipse cx="22" cy="42" rx="9.5" ry="8" transform="rotate(-45 22 42)" fill="url(#daging)"/>
          <ellipse cx="32" cy="32" rx="9.5" ry="8" transform="rotate(-45 32 32)" fill="url(#daging)"/>
          <ellipse cx="42" cy="22" rx="9.5" ry="8" transform="rotate(-45 42 22)" fill="url(#daging)"/>
        </svg>
      </div>
      <h1 class="nama">MaduraNyam</h1>
    </div>
    <div class="progres" aria-hidden="true"><span></span></div>
  </main>

  <!-- Firebase (database Firestore) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
