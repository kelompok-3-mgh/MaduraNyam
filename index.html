<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#D7261E">
  <title>MaduraNyam</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍢</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Tampilan loading: hanya nama aplikasi dan animasi sate -->
  <main class="loading" role="status" aria-label="MaduraNyam">
    <h1 class="nama">MaduraNyam</h1>
    <div class="sate" aria-hidden="true">
      <span style="--i:0; --r:-6deg"></span>
      <span style="--i:1; --r:5deg"></span>
      <span style="--i:2; --r:-3deg"></span>
      <span style="--i:3; --r:7deg"></span>
    </div>
  </main>

  <!-- Firebase (database Firestore) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
